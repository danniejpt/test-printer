<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>318Pro iPhone BLE Test</title><style>body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0;padding:18px;background:#f4f6f9;color:#182334}h1{font-size:22px}button{display:block;width:100%;margin:10px 0;padding:15px;border:0;border-radius:9px;background:#1763c6;color:white;font:600 16px Arial}button:active{background:#093e86}pre{background:#101827;color:#d5f8db;padding:13px;min-height:120px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px}input{width:100%;padding:12px;box-sizing:border-box;font-size:15px}section{background:#fff;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#526070;font-size:14px}</style></head><body><h1>318Pro — iPhone Bluetooth test v2</h1><p class="muted">Mở bằng Bluefy qua HTTPS. Bản này có nút test độc lập để kiểm tra JavaScript.</p><section><button onclick="document.getElementById('log').textContent+='BUTTON HTML OK\n'">1. Test nút HTML</button><button id="jsBtn">2. Test JavaScript</button><button id="connectBtn">3. Quét / Kết nối BLE</button><p class="muted">Service UUID để được phép đọc (ví dụ ffe0). Không có nghĩa máy dùng UUID này.</p><input id="uuid" value="ffe0,fff0,ff00" placeholder="ffe0,fff0,ff00"><button id="scanBtn">4. Đọc service/characteristic</button><button id="printBtn">5. Gửi HELLO thử (ESC/POS)</button></section><section><b>Nhật ký</b><pre id="log">HTML LOADED (nếu còn dòng này thì JS chưa chạy)\n</pre><button id="copyBtn">Copy nhật ký</button></section><script>
(function(){
var el=function(id){return document.getElementById(id)};
var device=null,server=null,writes=[];
function log(msg){el('log').textContent+=new Date().toLocaleTimeString()+' '+msg+'\n';}
function err(e){log('ERROR: '+(e && e.name ? e.name+': ' : '')+(e && e.message ? e.message : String(e)));}
window.onerror=function(message,source,line){log('SCRIPT ERROR: '+message+' line '+line);};
window.onunhandledrejection=function(e){err(e.reason||e);};
function uuid(s){s=s.trim().toLowerCase().replace(/^0x/,'');if(/^[0-9a-f]{4}$/.test(s))return '0000'+s+'-0000-1000-8000-00805f9b34fb';if(/^[0-9a-f]{8}$/.test(s))return s+'-0000-1000-8000-00805f9b34fb';if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s))return s;throw Error('UUID không đúng: '+s);}
el('jsBtn').onclick=function(){log('JS BUTTON OK');log('HTTPS secure='+String(window.isSecureContext));log('WebBluetooth='+String(!!navigator.bluetooth));log('UA='+navigator.userAgent);};
el('connectBtn').onclick=function(){try{if(!navigator.bluetooth){log('NO WEB BLUETOOTH API. Hãy mở bằng Bluefy, không phải Safari/Chrome.');return;}var a=el('uuid').value.split(',').filter(function(x){return x.trim()}).map(uuid);log('Opening BLE device picker...');navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:a}).then(function(d){device=d;log('DEVICE: '+(d.name||'unknown'));return d.gatt.connect();}).then(function(s){server=s;log('CONNECTED; press Read services');return scan();}).catch(err);}catch(e){err(e);}};
function scan(){if(!server||!server.connected){log('Connect first');return Promise.resolve();}writes=[];return server.getPrimaryServices().then(function(services){log('SERVICES COUNT: '+services.length);var p=Promise.resolve();services.forEach(function(s){p=p.then(function(){log('SERVICE: '+s.uuid);return s.getCharacteristics().then(function(chars){chars.forEach(function(c){var x=c.properties;log('  CHAR: '+c.uuid+' write='+x.write+' writeNoResp='+x.writeWithoutResponse);if(x.write||x.writeWithoutResponse)writes.push(c);});});});});return p;}).then(function(){log('WRITABLE COUNT: '+writes.length);}).catch(err);}
el('scanBtn').onclick=scan;
el('printBtn').onclick=function(){if(!writes.length){log('No writable characteristic found; cannot send');return;}var c=writes[0];var bytes=new Uint8Array([27,64,72,69,76,76,79,32,51,49,56,80,82,79,10,10]);log('Sending '+bytes.length+' bytes to '+c.uuid);var method=c.properties.writeWithoutResponse?'writeValueWithoutResponse':'writeValueWithResponse';if(typeof c[method]!=='function')method='writeValue';c[method](bytes).then(function(){log('WRITE OK — Nếu chưa in, có thể sai giao thức');}).catch(err);};
el('copyBtn').onclick=function(){var t=el('log').textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){log('COPIED')}).catch(err);}else{log('Clipboard API unavailable — chụp ảnh log');}};
log('SCRIPT READY; secure='+String(window.isSecureContext)+' BLE='+String(!!navigator.bluetooth));
})();
</script></body></html>
